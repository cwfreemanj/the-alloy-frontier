# Render blueprint for the shared-world server (serves the game and the world socket).
# Free plan: no cost; the server sleeps after ~15 minutes with nobody connected and takes
# about a minute to wake on the next visit. No secrets are needed.
services:
  - type: web
    name: alloy-frontier
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w @alloy/web
    startCommand: npm run world:start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      # Lets the copy of the game on Vercel join this world too.
      - key: ALLOWED_ORIGINS
        value: https://alloy-frontier.vercel.app
      # Postgres connection string for accounts and saves. Secret: set it in the
      # Render dashboard (Environment), never in this file. Without it, accounts are
      # kept in a temporary file that Render wipes on every deploy.
      - key: DATABASE_URL
        sync: false
      # Optional: Neon's direct (non-pooled) connection string, used once at startup to
      # create the table. Also a secret, set in the dashboard.
      - key: DATABASE_URL_UNPOOLED
        sync: false
